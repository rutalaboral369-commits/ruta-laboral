<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimizador Profesional de CV</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
  <header class="bg-indigo-700 text-white shadow-md py-6 px-8">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Optimizador Profesional de CV</h1>
      <span class="text-xs bg-indigo-800 px-3 py-1 rounded-full font-medium">IA Privada & Local (Qwen 2.5)</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto w-full p-6 flex-grow grid grid-cols-1 md:grid-cols-3 gap-8">
    <section class="md:col-span-1 space-y-6">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-semibold text-slate-700 mb-4">1. Sube tu Currículum</h2>
        <input type="file" id="cvFile" accept=".pdf,.docx,.txt" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer"/>
        <button id="uploadBtn" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">Analizar CV</button>
        <div id="uploadStatus" class="mt-3 text-sm text-center font-medium text-slate-600"></div>
      </div>

      <div id="optionsContainer" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hidden">
        <h2 class="text-lg font-semibold text-slate-700 mb-4">2. Elige un Enfoque</h2>
        <div id="optionsList" class="space-y-3"></div>
      </div>
    </section>

    <section class="md:col-span-2 space-y-6">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col h-[780px]">
        <div class="flex flex-wrap justify-between items-center mb-4 pb-3 border-b border-slate-100 gap-3">
          <div>
            <h2 class="text-lg font-semibold text-slate-700">Resultado Optimizado</h2>
            <div id="activeFocusBadge" class="text-xs text-indigo-600 font-medium mt-1 hidden">
              Enfoque activo: <span id="currentFocusName" class="bg-indigo-50 px-2 py-0.5 rounded border border-indigo-200 font-bold">Ninguno</span>
            </div>
          </div>
          <div id="actionButtons" class="flex items-center gap-2 hidden">
            <button id="copyBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium py-2 px-3 rounded-lg transition-colors border border-slate-300">📋 Copiar Texto</button>
            <button id="downloadBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium py-2 px-3 rounded-lg transition-colors shadow-sm">💾 Descargar Word (.docx)</button>
          </div>
        </div>
        
        <div id="previewArea" class="flex-grow border border-slate-200 rounded-lg p-6 overflow-y-auto bg-slate-50 font-mono text-xs text-slate-700 whitespace-pre-wrap">
          Sube tu archivo y selecciona un enfoque profesional para ver la optimización aquí.
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
